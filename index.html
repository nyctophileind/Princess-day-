<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Princess Day 👑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#3b1f4a;
  --rose:#e8789a;
  --blush:#fde4ec;
  --lilac:#cdb4f0;
  --gold:#d9a441;
  --paper:#fffafc;
  --ink:#4a2c57;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:'Lora',Georgia,serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 50% -10%,#6a3a85 0%,var(--plum) 60%,#25122f 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.script{font-family:'Pinyon Script',cursive;font-weight:400}

/* ---------- Stage 1: envelope ---------- */
#intro{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;color:var(--blush);
}
#intro h1{font-size:clamp(2.6rem,10vw,4.2rem);line-height:1.1}
#intro p.hint{font-size:.95rem;opacity:.8;font-style:italic}
.envelope{
  position:relative;width:min(300px,78vw);aspect-ratio:3/2;border:0;cursor:pointer;
  background:var(--rose);border-radius:6px;box-shadow:0 22px 50px rgba(0,0,0,.45);
  -webkit-tap-highlight-color:transparent;transition:transform .25s;
}
.envelope:hover{transform:translateY(-4px) rotate(-1deg)}
.envelope::before{ /* body fold lines */
  content:"";position:absolute;inset:0;border-radius:6px;
  background:
    linear-gradient(to top right,transparent 49.6%,rgba(255,255,255,.28) 50%,transparent 50.6%) left/50% 100% no-repeat,
    linear-gradient(to top left,transparent 49.6%,rgba(255,255,255,.28) 50%,transparent 50.6%) right/50% 100% no-repeat;
}
.flap{
  position:absolute;left:0;top:0;width:100%;height:55%;background:#d9648a;
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease;
  border-radius:6px 6px 0 0;
}
.seal{
  position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:50%;background:var(--gold);
  display:grid;place-items:center;font-size:1.5rem;box-shadow:0 3px 8px rgba(0,0,0,.35);
  transition:opacity .3s;z-index:2;
}
.envelope .to{
  position:absolute;bottom:12%;width:100%;text-align:center;font-size:1.7rem;color:#fff;
}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0}

/* ---------- Stage 2: letter + gallery ---------- */
#content{display:none;padding:40px 18px 80px;max-width:760px;margin:0 auto}
#content.show{display:block;animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

.letter{
  background:var(--paper);border-radius:10px;padding:clamp(26px,6vw,52px);
  box-shadow:0 24px 60px rgba(0,0,0,.4);position:relative;
}
.letter::before{
  content:"";position:absolute;inset:10px;border:1.5px solid var(--lilac);border-radius:6px;pointer-events:none;
}
.letter h2{font-size:clamp(2.4rem,9vw,3.6rem);color:var(--rose);line-height:1.1;margin-bottom:18px}
.letter .body p{font-size:1.08rem;line-height:1.8;margin-bottom:1em;max-width:62ch}
.letter .sign{margin-top:26px;font-size:2rem;color:var(--rose)}

.gallery-title{
  text-align:center;color:var(--blush);font-size:clamp(2rem,8vw,3rem);margin:64px 0 28px;
}
.photos{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px 22px;
}
.polaroid{
  background:#fff;padding:12px 12px 14px;border-radius:3px;border:0;cursor:zoom-in;text-align:center;
  box-shadow:0 14px 30px rgba(0,0,0,.4);font:inherit;color:var(--ink);
  transition:transform .25s;
}
.polaroid:nth-child(odd){transform:rotate(-2deg)}
.polaroid:nth-child(even){transform:rotate(1.8deg)}
.polaroid:hover,.polaroid:focus-visible{transform:rotate(0) scale(1.03)}
.polaroid .frame{aspect-ratio:4/5;overflow:hidden;background:var(--blush);display:grid;place-items:center;font-size:3rem}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid .cap{margin-top:10px;font-size:1.5rem;color:var(--plum);min-height:1.6em}

.actions{text-align:center;margin-top:56px}
.btn{
  font:inherit;font-size:1.05rem;color:var(--plum);background:var(--gold);border:0;border-radius:999px;
  padding:12px 28px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.3);
}
.btn:hover{filter:brightness(1.08)}

/* lightbox */
#lightbox{
  position:fixed;inset:0;background:rgba(20,8,28,.92);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;z-index:50;
}
#lightbox.show{display:flex}
#lightbox img{max-width:100%;max-height:78vh;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lightbox p{color:var(--blush);font-size:1.8rem}
#lightbox .x{position:absolute;top:14px;right:18px;font-size:2rem;color:#fff;background:none;border:0;cursor:pointer}

/* floating hearts */
.float{position:fixed;bottom:-30px;pointer-events:none;z-index:40;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}

@media (prefers-reduced-motion:reduce){
  #content.show{animation:none}
  .flap,.envelope,.polaroid{transition:none}
  .float{display:none}
}
</style>
</head>
<body>

<!-- ============ STAGE 1 ============ -->
<section id="intro">
  <h1 class="script" id="introTitle"></h1>
  <button class="envelope" id="envelope" aria-label="Open the letter">
    <div class="flap"></div>
    <div class="seal">👑</div>
    <div class="to script" id="envTo"></div>
  </button>
  <p class="hint">tap the envelope to open</p>
</section>

<!-- ============ STAGE 2 ============ -->
<main id="content">
  <article class="letter">
    <h2 class="script" id="greeting"></h2>
    <div class="body" id="message"></div>
    <p class="sign script" id="signoff"></p>
  </article>

  <h3 class="gallery-title script" id="galleryTitle"></h3>
  <div class="photos" id="photos"></div>

  <div class="actions">
    <button class="btn" id="again">Open again 💌</button>
  </div>
</main>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" id="close" aria-label="Close">×</button>
  <img id="lbImg" alt="">
  <p class="script" id="lbCap"></p>
</div>

<script>
/* =====================================================
   ✏️  EDIT THIS PART ONLY
   ===================================================== */
const CONFIG = {
  herName:  "Princess",                       // her name or nickname
  yourName: "Me",                             // your name for the sign-off
  tabTitle: "Princess Day 👑",
  introTitle: "A royal letter\nfor you",      // \n = new line
  greeting: "Happy Princess Day! 👑",
  message: [
    "You make every ordinary day feel a little more magical, and today I wanted to remind you of that.",
    "Thank you for your laugh, your kindness, and all the little ways you light up my world.",
    "You deserve every crown, every flower, and every sweet thing life has to offer. Never forget how special you are."
  ],
  signoff: "With love 💗",
  galleryTitle: "Our favourite moments",

  /* Put your images inside the "photos" folder, then list them here.
     Add or remove lines freely. "caption" is optional. */
  photos: [
    { src: "IMG-20261118-WA0001.jpg", caption: "My favourite person" }
  ]
};
/* ===================================================== */

const $ = id => document.getElementById(id);
document.title = CONFIG.tabTitle;
$('introTitle').innerHTML = CONFIG.introTitle.split('\n').map(s=>esc(s)).join('<br>');
$('envTo').textContent = "for " + CONFIG.herName;
$('greeting').textContent = CONFIG.greeting;
$('message').innerHTML = CONFIG.message.map(p=>`<p>${esc(p)}</p>`).join('');
$('signoff').innerHTML = esc(CONFIG.signoff) + '<br>' + esc(CONFIG.yourName);
$('galleryTitle').textContent = CONFIG.galleryTitle;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* photos */
const grid = $('photos');
CONFIG.photos.forEach(p=>{
  const b = document.createElement('button');
  b.className = 'polaroid';
  b.setAttribute('aria-label','View photo' + (p.caption ? ': ' + p.caption : ''));
  const frame = document.createElement('div'); frame.className='frame';
  const img = new Image(); img.src = p.src; img.alt = p.caption || '';
  img.loading = 'lazy';
  img.onerror = () => { frame.textContent = '👑'; img.remove(); b.dataset.missing = '1'; };
  frame.appendChild(img);
  const cap = document.createElement('div'); cap.className='cap script'; cap.textContent = p.caption || '';
  b.append(frame, cap);
  b.onclick = () => { if(b.dataset.missing) return; openLB(p); };
  grid.appendChild(b);
});

/* lightbox */
function openLB(p){
  $('lbImg').src = p.src; $('lbImg').alt = p.caption || '';
  $('lbCap').textContent = p.caption || '';
  $('lightbox').classList.add('show'); $('close').focus();
}
function closeLB(){ $('lightbox').classList.remove('show'); }
$('close').onclick = closeLB;
$('lightbox').onclick = e => { if(e.target.id==='lightbox') closeLB(); };
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLB(); });

/* open / close letter */
const env = $('envelope');
env.onclick = () => {
  env.classList.add('open');
  hearts();
  setTimeout(() => {
    $('intro').style.display = 'none';
    $('content').classList.add('show');
    window.scrollTo(0,0);
  }, 750);
};
$('again').onclick = () => {
  $('content').classList.remove('show');
  env.classList.remove('open');
  $('intro').style.display = 'flex';
  window.scrollTo(0,0);
};

function hearts(){
  const set = ['💗','👑','✨','💖','🌸'];
  for(let i=0;i<22;i++){
    const h = document.createElement('div');
    h.className = 'float';
    h.textContent = set[Math.floor(Math.random()*set.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (16 + Math.random()*22) + 'px';
    h.style.animationDuration = (3 + Math.random()*3) + 's';
    h.style.animationDelay = (Math.random()*0.8) + 's';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 7500);
  }
}
</script>
</body>
</html>
